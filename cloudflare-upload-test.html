<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Chidsey Chowdown — Cloudflare photo test</title><style>body{font:16px system-ui,sans-serif;max-width:680px;margin:35px auto;padding:0 18px;color:#243b32}button{background:#23664b;color:white;border:0;padding:12px 18px;border-radius:8px;cursor:pointer}button:disabled{opacity:.5}input{margin:20px 0}#status{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;background:#f2f5f2;border-radius:8px}img{max-width:100%;max-height:340px}a{color:#23664b}</style></head><body><h1>Cloudflare photo upload test</h1><p>This test uploads one JPEG directly to Cloudflare R2. <strong>It does not change any recipe or existing photograph.</strong> You must already be signed in to the main website in this browser.</p><p><a href="/">Back to Chidsey Chowdown</a></p><label>Choose a JPEG photo: <input id="file" type="file" accept="image/jpeg"></label><p><button id="test" disabled>Test Cloudflare upload</button></p><div id="status" role="status">Checking your sign-in…</div><p id="result"></p><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const status=document.getElementById('status'),btn=document.getElementById('test'),file=document.getElementById('file'),result=document.getElementById('result');
const client=window.supabase.createClient('https://vjqffpdggasgtgnxtktj.supabase.co','sb_publishable_YyUFvcXzXzDjI3tZX8P7kg_SyNSWUJK');
async function session(){const{data,error}=await client.auth.getSession();if(error)throw error;return data.session}
(async()=>{try{const s=await session();status.textContent=s?'Signed in. Select a JPEG photograph to test.':'Not signed in. Please sign in on the main website, then refresh this page.';btn.disabled=!s}catch(e){status.textContent='Sign-in check failed: '+e.message}})();
btn.onclick=async()=>{result.textContent='';const f=file.files[0];if(!f){status.textContent='Choose a JPEG photo first.';return}if(f.type!=='image/jpeg'||f.size>5*1024*1024){status.textContent='Choose a JPEG smaller than 5 MB.';return}btn.disabled=true;status.textContent='Uploading to Cloudflare…';try{const s=await session();if(!s)throw Error('Session expired. Sign in again.');const response=await fetch('https://chidsey-photo-upload.vph9gmfws7.workers.dev/',{method:'POST',headers:{Authorization:'Bearer '+s.access_token,'Content-Type':'image/jpeg'},body:f});const payload=await response.json();if(!response.ok)throw Error((payload.error||'Upload failed')+' (HTTP '+response.status+')');if(!/^https:\/\/images\.chidseychowdown\.co\.uk\/127e4f28-83e6-4a91-a786-bdb51a965830\//.test(payload.url||''))throw Error('Unexpected photo URL');status.textContent='SUCCESS — Cloudflare accepted your photo. The recipe book was not changed.';const a=document.createElement('a');a.href=payload.url;a.target='_blank';a.rel='noopener';a.textContent='View uploaded photo on Cloudflare';result.replaceChildren(a)}catch(e){status.textContent='TEST FAILED — '+e.message}finally{btn.disabled=false}};
</script></body></html>
