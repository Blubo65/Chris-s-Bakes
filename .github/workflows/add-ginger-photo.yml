name: Add ginger nuts photo
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  add-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add photo and recipe reference
        env:
          IMG_B64: ""
        run: |
          echo "$IMG_B64" | base64 -d > "ginger-nuts.jpg"
          python3 - <<'PY2'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='"id":"ginger-nuts-air-fryer"'
          i=s.find(marker)
          if i<0: raise SystemExit('Ginger Nuts recipe not found')
          j=s.find('"photo":',i)
          if j<0 or j>s.find('}',i)+1:
              k=s.find('"notes":',i)
              s=s[:k]+'"photo":"ginger-nuts.jpg",'+s[k:]
          else:
              e=s.find(',',j)
              s=s[:j]+'"photo":"ginger-nuts.jpg"'+s[e:]
          p.write_text(s)
          PY2
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html ginger-nuts.jpg
          git diff --cached --quiet || (git commit -m "Add photo to McVitie’s-Style Ginger Nuts" && git push)
