name: Add modern category icons
on:
  push:
    paths:
      - '.github/workflows/add-category-icons.yml'
permissions:
  contents: write
jobs:
  update:
    if: "!contains(github.event.head_commit.message, 'Add modern single-colour category icons')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add category icon styling and rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          css=r'''
          .category-icons{display:flex;align-items:center;gap:6px;flex-wrap:wrap;max-width:100%;padding:5px 7px}
          .category-badge{display:inline-flex;align-items:center;gap:4px;color:var(--green);font-size:10px;font-weight:700;line-height:1;padding:4px 6px;background:#fffefaee;border:1px solid #e8eeeb;border-radius:7px;white-space:nowrap}
          .category-badge svg{width:15px;height:15px;display:block;flex:none;color:currentColor}
          .detail-category-icons{display:flex;gap:7px;flex-wrap:wrap}
          .detail-category-icons .category-badge{background:#f1f4f5;border-color:#e1e7eb;font-size:11px;padding:6px 8px}
          @media(max-width:560px){.category-badge span{display:none}.category-badge{padding:5px}.category-badge svg{width:17px;height:17px}}
          '''
          marker='</style>'
          assert marker in s, 'style closing tag not found'
          s=s.replace(marker,css+marker,1)

          js=r'''function categoryIcon(c){
            const k=String(c||'').toLowerCase();
            if(k==='air fryer'||k==='airfryer') return '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 2h14a2 2 0 0 1 2 2v8H3V4a2 2 0 0 1 2-2Zm-2 12h18v3.5A4.5 4.5 0 0 1 16.5 22h-9A4.5 4.5 0 0 1 3 17.5V14Zm4-9v4h2V5H7Zm5 0v4h2V5h-2Zm-2 12a3 3 0 0 0 3-3H9a3 3 0 0 0 3 3Z"/></svg>';
            if(k==='cakes') return '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 8V5h2v3h2V4h2v4h2V5h2v3a5 5 0 0 1 3 4.6V19a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-6.4A5 5 0 0 1 7 8Zm-1 6c1.2 1 2.5 1.4 4 1.4s2.8-.4 4-1.4c1.2 1 2.5 1.4 4 1.4v-2.2a3 3 0 0 0-6 0 3 3 0 0 0-6 0V15Z"/></svg>';
            if(k==='biscuits & cookies') return '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.5 4.5a6 6 0 0 0-7.7 8.9A6 6 0 1 1 19.5 4.5Z"/><circle cx="16" cy="7" r="1.2"/><circle cx="19" cy="10" r="1.2"/><circle cx="14" cy="11" r="1.1"/></svg>';
            if(k==='main meals') return '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 10h16v2H4zM6 12h12l-1 6H7l-1-6Zm2-5a4 4 0 0 1 8 0h-2a2 2 0 0 0-4 0H8Z"/></svg>';
            if(k==='side dishes') return '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 10h16v2a7 7 0 0 1-7 7h-2a7 7 0 0 1-7-7v-2Zm2-2a6 6 0 0 1 12 0H6Zm6 11v3h-2v-3h2Zm-3-2h6v2H9v-2Z"/></svg>';
            if(k==='desserts') return '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 11h14v2H5v-2Zm1 2h12l-1.5 7h-9L6 13Zm4-4h4V7a2 2 0 1 0-4 0v2Zm2-7c.8 1.2.8 2.2 0 3.5-.8-1.3-.8-2.3 0-3.5Z"/></svg>';
            if(k==='breads') return '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 13c0-4 3.4-7 8-7s8 3 8 7v4a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-4Zm3-1c1.2-.8 2.2-.8 3 0 .8.5 1.5.5 2.3 0 .8-.5 1.5-.5 2.3 0 .8.5 1.5.5 2.4 0"/></svg>';
            return '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 3h2v7h2V3h2v7h2V3h2v7a4 4 0 0 1-4 4v7h-2v-7a4 4 0 0 1-4-4V3Zm10 0h2v18h-2V3Z"/></svg>';
          }
          function categoryBadge(c){return '<span class="category-badge" title="'+esc(c)+'">'+categoryIcon(c)+'<span>'+esc(c)+'</span></span>';}
          '''
          marker='function render(){'
          assert marker in s, 'render function not found'
          s=s.replace(marker,js+marker,1)

          old='<span class="category-tag">\${esc((Array.isArray(r.categories)&&r.categories.length?r.categories:[r.category||\\'Other\\']).join(\\' · \\'))}</span>'
          new='<span class="category-tag category-icons">\${(Array.isArray(r.categories)&&r.categories.length?r.categories:[r.category||\\'Other\\']).map(c=>categoryBadge(c)).join(\\'\\')}</span>'
          assert old in s, 'recipe category tag not found'
          s=s.replace(old,new,1)

          old="document.getElementById('detailCategory').textContent=(Array.isArray(r.categories)&&r.categories.length?r.categories:[r.category||'Other']).join(' · ');"
          new="document.getElementById('detailCategory').innerHTML='<span class=\"detail-category-icons\">'+(Array.isArray(r.categories)&&r.categories.length?r.categories:[r.category||'Other']).map(c=>categoryBadge(c)).join('')+'</span>';"
          assert old in s, 'detail category line not found'
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
      - name: Commit website update and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/add-category-icons.yml
          git commit -m "Add modern single-colour category icons"
          git push
