name: Replace website cover image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace-cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download new cover image
        run: |
          curl -L --fail --retry 3 "https://at.adobe.com/6hmr1b6OV1FBqPiK" -o "cover image.jpg"
          file "cover image.jpg"
      - name: Commit cover image
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "cover image.jpg"
          git diff --cached --quiet || (git commit -m "Replace website cover image" && git push)
