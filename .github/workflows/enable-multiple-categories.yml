name: Enable multiple recipe categories
on:
  push:
    paths:
      - '.github/workflows/enable-multiple-categories.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update recipe category support
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old='<div class="field"><label for="category">Category</label><select id="category"><option>Air fryer</option><option>Cakes</option><option>Biscuits & cookies</option><option>Main meals</option><option>Side dishes</option><option>Desserts</option><option>Breads</option><option>Other</option></select></div>'
          new='''<div class="field full"><label>Categories (choose up to 3)</label><div id="categoryChoices" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px 0"><label><input type="checkbox" name="recipeCategory" value="Air fryer" style="width:auto"> Air fryer</label><label><input type="checkbox" name="recipeCategory" value="Cakes" style="width:auto"> Cakes</label><label><input type="checkbox" name="recipeCategory" value="Biscuits & cookies" style="width:auto"> Biscuits & cookies</label><label><input type="checkbox" name="recipeCategory" value="Main meals" style="width:auto"> Main meals</label><label><input type="checkbox" name="recipeCategory" value="Side dishes" style="width:auto"> Side dishes</label><label><input type="checkbox" name="recipeCategory" value="Desserts" style="width:auto"> Desserts</label><label><input type="checkbox" name="recipeCategory" value="Breads" style="width:auto"> Breads</label><label><input type="checkbox" name="recipeCategory" value="Other" style="width:auto"> Other</label></div><div class="notice">Choose at least 1 and up to 3 categories.</div></div>'''
          assert old in s, 'category field not found'
          s=s.replace(old,new,1)

          old="r.category=String(r.category||'Other').trim()||'Other';"
          new="r.categories=Array.isArray(r.categories)?r.categories.map(x=>String(x).trim()).filter(Boolean).slice(0,3):[String(r.category||'Other').trim()||'Other'];r.category=r.categories[0]||'Other';"
          assert old in s
          s=s.replace(old,new,1)

          old="let filtered=recipes.filter(r=>(active==='All'||r.category===active)&&(!q||[r.name,r.description,r.category,r.ingredients,r.method,r.notes].join(' ').toLowerCase().includes(q)));"
          new="let filtered=recipes.filter(r=>{const cats=Array.isArray(r.categories)&&r.categories.length?r.categories:[r.category||'Other'];return (active==='All'||cats.includes(active))&&(!q||[r.name,r.description,cats.join(' '),r.ingredients,r.method,r.notes].join(' ').toLowerCase().includes(q))});"
          assert old in s
          s=s.replace(old,new,1)

          old="recipes.filter(r=>r.category===c).length||''"
          new="recipes.filter(r=>(Array.isArray(r.categories)&&r.categories.length?r.categories:[r.category||'Other']).includes(c)).length||''"
          assert old in s
          s=s.replace(old,new,1)

          old='<span class="category-tag">${esc(r.category)}</span>'
          new='<span class="category-tag">${esc((Array.isArray(r.categories)&&r.categories.length?r.categories:[r.category||\'Other\']).join(\' · \'))}</span>'
          assert old in s
          s=s.replace(old,new,1)

          old="function setCategory(c){active=c;render()}function openAdd(){if(!cloudUser){setSyncStatus('Only the recipe book owner can add or edit recipes.');return}document.getElementById('recipeForm').reset();"
          new="function setCategory(c){active=c;render()}function selectedCategories(){return [...document.querySelectorAll('input[name=\\\"recipeCategory\\\"]:checked')].map(x=>x.value)}function setSelectedCategories(values){const wanted=new Set(Array.isArray(values)?values:[]);document.querySelectorAll('input[name=\\\"recipeCategory\\\"]').forEach(x=>x.checked=wanted.has(x.value))}document.getElementById('categoryChoices').addEventListener('change',e=>{if(e.target.matches('input[name=\\\"recipeCategory\\\"]')&&selectedCategories().length>3){e.target.checked=false;alert('You can choose up to 3 categories.')}});function openAdd(){if(!cloudUser){setSyncStatus('Only the recipe book owner can add or edit recipes.');return}document.getElementById('recipeForm').reset();"
          assert old in s
          s=s.replace(old,new,1)

          old="let r={id,name:val('name'),category:val('category'),time:val('time'),serves:val('serves'),emoji:val('emoji'),description:val('description'),ingredients:val('ingredients'),method:val('method'),notes:val('notes'),photo,created:old?.created||Date.now()};"
          new="const chosenCategories=selectedCategories();if(!chosenCategories.length){alert('Please choose at least one category.');setSyncStatus('Choose at least one category.');return}let r={id,name:val('name'),categories:chosenCategories,category:chosenCategories[0],time:val('time'),serves:val('serves'),emoji:val('emoji'),description:val('description'),ingredients:val('ingredients'),method:val('method'),notes:val('notes'),photo,created:old?.created||Date.now()};"
          assert old in s
          s=s.replace(old,new,1)

          old="document.getElementById('detailCategory').textContent=r.category;"
          new="document.getElementById('detailCategory').textContent=(Array.isArray(r.categories)&&r.categories.length?r.categories:[r.category||'Other']).join(' · ');"
          assert old in s
          s=s.replace(old,new,1)

          old="['name','category','time','serves','emoji','description','ingredients','method','notes'].forEach(k=>document.getElementById(k).value=r[k]||'');"
          new="['name','time','serves','emoji','description','ingredients','method','notes'].forEach(k=>document.getElementById(k).value=r[k]||'');setSelectedCategories(Array.isArray(r.categories)&&r.categories.length?r.categories:[r.category||'Other']);"
          assert old in s
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
      - name: Commit website update and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/enable-multiple-categories.yml
          git add index.html
          git commit -m "Enable up to three categories per recipe"
          git push
